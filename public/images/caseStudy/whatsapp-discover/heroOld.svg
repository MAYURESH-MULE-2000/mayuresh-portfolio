<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="WhatsApp Discover - local business discovery via Channels">
  <defs>
    <linearGradient id="wabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F1C" />
      <stop offset="55%" stop-color="#0F3D33" />
      <stop offset="100%" stop-color="#25D366" />
    </linearGradient>
    <radialGradient id="waglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#25D366" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect x="-200" y="-200" width="1600" height="1300" fill="url(#wabg)" />
  <circle cx="600" cy="760" r="620" fill="url(#waglow)" />

  <g font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(600, 190)">
      <rect x="-170" y="-28" width="340" height="46" rx="23" fill="#25D366" fill-opacity="0.16" stroke="#25D366" stroke-opacity="0.4" />
      <text y="3" fill="#86EFAC" font-size="19" font-weight="700" letter-spacing="4.5">PM CASE STUDY · 0 TO 1</text>
    </g>

    <text x="600" y="308" fill="#FFFFFF" font-size="84" font-weight="800" letter-spacing="-2.5">WhatsApp Discover</text>
    <text x="600" y="370" fill="#D1FAE5" font-size="29" font-weight="500">Local businesses, found by the people next door.</text>
  </g>

  <!-- Phone mock: Discover feed -->
  <g transform="translate(430, 430)">
    <rect x="0" y="0" width="340" height="400" rx="34" fill="#0A1512" fill-opacity="0.62" stroke="url(#waEdge)" stroke-width="2" />

    <!-- header -->
    <g transform="translate(24, 26)">
      <text x="0" y="18" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">Discover</text>
      <g transform="translate(196, 0)">
        <rect x="0" y="0" width="96" height="26" rx="13" fill="#25D366" fill-opacity="0.22" />
        <circle cx="17" cy="13" r="4" fill="#25D366" />
        <text x="30" y="18" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#86EFAC">2 KM</text>
      </g>
    </g>

    <!-- merchant rows -->
    <g transform="translate(24, 74)">
      <g>
        <rect x="0" y="0" width="292" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.09" />
        <circle cx="40" cy="38" r="22" fill="#25D366" fill-opacity="0.5" />
        <rect x="76" y="22" width="112" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.5" />
        <rect x="76" y="44" width="150" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.22" />
        <rect x="208" y="26" width="66" height="26" rx="13" fill="#25D366" fill-opacity="0.85" />
        <text x="241" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="0.8" fill="#04150F">FOLLOW</text>
      </g>

      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="292" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.09" />
        <circle cx="40" cy="38" r="22" fill="#FFFFFF" fill-opacity="0.22" />
        <rect x="76" y="22" width="92" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.5" />
        <rect x="76" y="44" width="132" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.22" />
        <rect x="208" y="26" width="66" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.14" />
        <text x="241" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="0.8" fill="#D1FAE5">FOLLOW</text>
        <g transform="translate(76, 60)">
          <rect x="0" y="0" width="72" height="16" rx="8" fill="#25D366" fill-opacity="0.2" />
          <text x="36" y="12" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="0.8" fill="#86EFAC">BOOSTED</text>
        </g>
      </g>

      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="292" height="76" rx="18" fill="#FFFFFF" fill-opacity="0.09" />
        <circle cx="40" cy="38" r="22" fill="#FFFFFF" fill-opacity="0.18" />
        <rect x="76" y="22" width="104" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.5" />
        <rect x="76" y="44" width="118" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.22" />
        <rect x="208" y="26" width="66" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.14" />
        <text x="241" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="0.8" fill="#D1FAE5">FOLLOW</text>
      </g>
    </g>

    <!-- privacy footnote -->
    <g transform="translate(24, 350)">
      <rect x="0" y="0" width="292" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.07" />
      <g transform="translate(14, 7)" opacity="0.9">
        <rect x="0" y="6" width="14" height="10" rx="3" fill="#86EFAC" />
        <path d="M3 6 V4 a4 4 0 0 1 8 0 V6" fill="none" stroke="#86EFAC" stroke-width="2" />
      </g>
      <text x="40" y="20" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6" fill="#A7F3D0">Merchants never see who follows</text>
    </g>
  </g>
</svg>
