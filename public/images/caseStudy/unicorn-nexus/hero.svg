<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Unicorn Nexus - an AI knowledge intelligence platform">
  <defs>
    <linearGradient id="unbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150E2E" />
      <stop offset="55%" stop-color="#241A55" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <radialGradient id="unglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="unEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="unBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <rect x="-200" y="-200" width="1600" height="1300" fill="url(#unbg)" />
  <circle cx="600" cy="760" r="620" fill="url(#unglow)" />

  <g font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(600, 190)">
      <rect x="-186" y="-28" width="372" height="46" rx="23" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.35" />
      <text y="3" fill="#C4B5FD" font-size="19" font-weight="700" letter-spacing="4.5">KNOWLEDGE INTELLIGENCE</text>
    </g>

    <text x="600" y="308" fill="#FFFFFF" font-size="84" font-weight="800" letter-spacing="-2.5">Unicorn Nexus</text>
    <text x="600" y="370" fill="#CBD5E1" font-size="29" font-weight="500">What your chatbot can't answer is the product.</text>
  </g>

  <!-- Dashboard mock -->
  <g transform="translate(190, 430)">
    <rect x="0" y="0" width="820" height="380" rx="30" fill="#0B0A1A" fill-opacity="0.55" stroke="url(#unEdge)" stroke-width="2" />

    <!-- top metric row -->
    <g transform="translate(34, 32)">
      <rect x="0" y="0" width="240" height="96" rx="20" fill="#FFFFFF" fill-opacity="0.09" />
      <text x="24" y="36" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#A5B4FC">I DON'T KNOW RATE</text>
      <text x="24" y="76" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">12.4%</text>
      <path d="M180 70 l16 -14 l14 10 l18 -22" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

      <rect x="256" y="0" width="240" height="96" rx="20" fill="#FFFFFF" fill-opacity="0.09" />
      <text x="280" y="36" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#A5B4FC">KNOWLEDGE GAPS</text>
      <text x="280" y="76" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">7</text>

      <rect x="512" y="0" width="240" height="96" rx="20" fill="#FFFFFF" fill-opacity="0.09" />
      <text x="536" y="36" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#A5B4FC">INTENT CLUSTERS</text>
      <text x="536" y="76" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">23</text>
    </g>

    <!-- ranked gap list -->
    <g transform="translate(34, 148)">
      <rect x="0" y="0" width="752" height="200" rx="22" fill="#FFFFFF" fill-opacity="0.07" />
      <text x="26" y="38" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8" fill="#DDD6FE">TOP KNOWLEDGE GAPS</text>

      <g transform="translate(26, 58)">
        <rect x="0" y="0" width="700" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.08" />
        <rect x="0" y="0" width="520" height="12" rx="6" fill="url(#unBar)" />
        <text x="0" y="34" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Shipping policy</text>
        <text x="700" y="34" text-anchor="end" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C4B5FD">41 unanswered</text>

        <rect x="0" y="54" width="700" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.08" />
        <rect x="0" y="54" width="330" height="12" rx="6" fill="url(#unBar)" />
        <text x="0" y="88" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Pricing tiers</text>
        <text x="700" y="88" text-anchor="end" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C4B5FD">26 unanswered</text>

        <rect x="0" y="108" width="700" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.08" />
        <rect x="0" y="108" width="190" height="12" rx="6" fill="url(#unBar)" />
        <text x="0" y="142" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Returns window</text>
        <text x="700" y="142" text-anchor="end" font-family="'Plus Jakarta Sans', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#C4B5FD">14 unanswered</text>
      </g>
    </g>
  </g>
</svg>
